name: macOS Package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Swift Tests
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run package tests
        run: swift test

  package:
    name: Build macOS App
    runs-on: macos-14
    needs: test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Eunomia.app (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Eunomia/Eunomia.xcodeproj \
            -scheme Eunomia \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        id: package
        run: |
          set -euo pipefail
          APP_PATH=".build/DerivedData/Build/Products/Release/Eunomia.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "App not found at ${APP_PATH}"
            exit 1
          fi

          SHA_SHORT="${GITHUB_SHA::7}"
          ARTIFACT_NAME="Eunomia-macOS-${SHA_SHORT}.zip"
          ARTIFACT_PATH="${PWD}/${ARTIFACT_NAME}"

          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ARTIFACT_PATH}"

          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=${ARTIFACT_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error

      - name: Publish release asset on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.artifact_path }}
          generate_release_notes: true
